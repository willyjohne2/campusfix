{% extends 'layout.html' %}
{% load static %}

{% block title %}
<title>Update Profile | CampusFix</title>
{% endblock %}

{% block css %}
<link rel="stylesheet" href="{% static 'css/profile.css' %}">
{% endblock %}

{% block content %}
<main class="dashboard-container">
  <div class="form-card">
    <h3 class="form-title">Update Profile</h3>

    <!-- Profile Picture at the top -->
    <div class="form-group profile-avatar">
        <img src="{% static 'images/default.jpg' %}" alt="Avatar" class="avatar-img">
    </div>

    <form method="POST" action="{% url 'update_profile' %}">
        {% csrf_token %}
        
        <div class="form-group">
            <label>Username (cannot change)</label>
            <input type="text" value="{{ user.username }}" disabled>
        </div>

        <div class="form-group">
            <label>Change Email</label>
            <input type="email" name="email" value="{{ user.email }}" required>
        </div>

        <button type="submit" class="btn-submit">Save Changes</button>
         <a href="{% url 'dashboard_home' %}" class="btn-secondary" style="margin-top:1rem;">Back to Dashboard</a>
    </form>
  </div>
</main>
{% endblock %}
